# Automated code review using Claude
# Triggers:
#   - Once automatically when a PR is opened or marked ready for review
#   - On demand by commenting "@claude" on a PR (non-fork PRs only)
name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]

  issue_comment:
    types: [created]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
    uses: mozilla/mozdata-actions/.github/workflows/claude-review.yml@<commit-sha> # <version>
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      # Optional: point Claude at the docs that hold repository conventions
      review-instructions: |-
        Refer to CONTRIBUTING.md for conventions and best practices.
